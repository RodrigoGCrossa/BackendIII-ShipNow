services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  api:
    build:
      context: .
      target: runtime
    image: shipnow:local
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/shipnow
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: "2097152"
      JSON_LIMIT_BYTES: "102400"
      REQUEST_TIMEOUT_MS: "30000"
      ENABLE_INTERNAL_ENDPOINTS: "false"
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:-true}"
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - api-logs:/app/logs
      - api-uploads:/app/uploads
    stop_grace_period: 15s
volumes:
  mongo-data:
  api-logs:
  api-uploads:
