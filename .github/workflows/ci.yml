name: ShipNow CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    name: Pruebas funcionales y regresión
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cp .env.test.example .env.test
      - run: npm run check && npm run audit
      - name: Suite funcional, primera corrida
        run: npm test
      - name: Suite funcional, segunda corrida
        run: npm test
  containers:
    name: Docker y Compose con MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir e iniciar servicios saludables
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verificar imagen y API productiva
        run: node scripts/smoke-container.js
      - name: Diagnóstico de contenedores
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 150
      - name: Limpiar recursos descartables del runner
        if: always()
        run: docker compose down --volumes --remove-orphans
  checkpoints:
    name: Etiquetar entregas verificadas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [functional, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Conservar checkpoints aprobados
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse refs/tags/preentrega-8 >/dev/null 2>&1; then
            git tag preentrega-8 7c8b127143e5ba6914fec5b3819a8f5062594fef
            git push origin refs/tags/preentrega-8
          fi
          if ! git rev-parse refs/tags/proyecto-final >/dev/null 2>&1; then
            git tag proyecto-final "$FINAL_SHA"
            git push origin refs/tags/proyecto-final
          fi
