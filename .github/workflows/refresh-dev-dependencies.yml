name: Revisar actualización de dependencias de pruebas
on:
  push:
    paths: ['.github/workflows/refresh-dev-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolver versiones corregidas
        run: |
          npm pkg set 'devDependencies.mocha=^12.0.3' 'overrides.glob=^14.0.2' 'overrides.minimatch=^11.0.1' 'engines.node=>=24'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
      - name: Revisar auditoría
        run: npm audit --json || true
      - name: Validar compatibilidad funcional
        run: |
          cp .env.test.example .env.test
          npm run check
          npm test
          npm test
      - name: Exportar resolución revisada
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {gzipSync} from 'node:zlib';
          const bundle={package:readFileSync('package.json','utf8'),lock:readFileSync('package-lock.json','utf8')};
          console.info('DEPENDENCY_BUNDLE_BEGIN'+gzipSync(Buffer.from(JSON.stringify(bundle))).toString('base64')+'DEPENDENCY_BUNDLE_END');
          JS
